<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' ws: wss:"
    />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 18px;
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
        background: Canvas;
        color: CanvasText;
        user-select: none;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      #panes {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 60vh;
        overflow-y: auto;
      }
      .pane {
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 8px;
        padding: 10px 12px 12px;
      }
      .pane-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      .pane-head .num {
        font-weight: 600;
        margin-right: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px 10px;
        align-items: center;
      }
      label {
        text-align: right;
        opacity: 0.75;
      }
      input {
        width: 100%;
        padding: 4px 6px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        border-radius: 5px;
        background: Field;
        color: FieldText;
        font: inherit;
      }
      .session-row {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
      }
      .session-status {
        font-size: 11px;
        opacity: 0.7;
      }
      button {
        font: inherit;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
        background: Field;
        color: CanvasText;
        cursor: default;
      }
      button:disabled {
        opacity: 0.4;
      }
      button.primary {
        background: #0a84ff;
        border-color: #0a84ff;
        color: white;
      }
      .icon-btn {
        padding: 2px 8px;
        font-size: 12px;
      }
      .hint {
        font-size: 11px;
        opacity: 0.6;
        margin: 10px 0 0;
      }
      .error {
        color: #e0443e;
        min-height: 16px;
        margin: 6px 0 0;
      }
      .footer {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 14px;
      }
      .footer .spacer {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <h1>Panes</h1>
    <div id="panes"></div>
    <p class="hint">
      Panes appear left to right in this order. The ID names the pane's persistent login session;
      "Clear session" wipes that pane's cookies and storage and reloads it. Column widths are set
      by dragging the dividers in the main window.
    </p>
    <p class="error" id="error"></p>
    <div class="footer">
      <button type="button" id="add">＋ Add pane</button>
      <span class="spacer"></span>
      <button type="button" id="cancel">Cancel</button>
      <button type="button" class="primary" id="save">Save</button>
    </div>
    <script type="module" src="./src/settings.ts"></script>
  </body>
</html>
